name: Idea
description: Something you'd like Smalti to do.
title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What you'd use it for
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: Version
      description: '"Report a Problem or Idea…" (⌘K) fills it in.'
      placeholder: Smalti 0.7.7 (abc1234) · macOS 27.2 · Apple M4
    validations:
      required: false
