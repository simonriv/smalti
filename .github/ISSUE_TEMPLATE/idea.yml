name: Idea
description: Algo que te gustaría que Smalti hiciera.
title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: La idea
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Para qué la usarías
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: Versión
      description: La rellena «Reportar un problema o una idea…» (⌘K).
      placeholder: Smalti 0.7.6 (abc1234) · macOS 27.2 · Apple M4
    validations:
      required: false
