name: Fallo
description: Algo de Smalti no funciona como esperabas.
title: "Fallo: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos
      value: |
        1.
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: Versión
      description: La rellena «Reportar un problema o una idea…» (⌘K). Si no, copia la línea de «Acerca de Smalti».
      placeholder: Smalti 0.7.6 (abc1234) · macOS 27.2 · Apple M4
    validations:
      required: true
