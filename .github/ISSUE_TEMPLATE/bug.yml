name: Bug
description: Something in Smalti doesn't work as you expected.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      value: |
        1.
    validations:
      required: false
  - type: input
    id: build
    attributes:
      label: Version
      description: '"Report a Problem or Idea…" (⌘K) fills it in. Otherwise, copy the line from "About Smalti".'
      placeholder: Smalti 0.7.7 (abc1234) · macOS 27.2 · Apple M4
    validations:
      required: true
