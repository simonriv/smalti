<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Timeline de la sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<!--
  Maqueta de F9 (Timeline de la sesión), en la línea de Observatorio.dc.html y Reanudar.dc.html, con los tokens de
  docs/design/README.md. Tableros: ?view=session|search|empty|fallback|unidentified&lang=es|en. Capturas con Chrome sin interfaz.
-->
<style>
  :root{--accent:#7aa2f7;--ring:#7aa2f780;--glow:#7aa2f722;--text:#d7dae0;--title:#e6e9ef;--muted:#8b919c;--soft:#aeb3bd;
        --green:#9ece6a;--amber:#e0af68;--red:#f7768e;--stopped:#6b717c;--cyan:#7dcfff;--purple:#bb9af7;--ghost:#5f6672;
        --panel:rgba(6,7,10,0.34);--line:rgba(255,255,255,0.06)}
  body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text)}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
  .lbl{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
  .kbd{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,0.12);color:var(--soft);background:rgba(255,255,255,0.04);white-space:nowrap}
  .desk{width:1440px;height:900px;position:relative;overflow:hidden;background-color:#0b0d12;
    background-image:radial-gradient(circle at 16% 20%,#284766 0,rgba(40,71,102,0) 38%),radial-gradient(circle at 84% 80%,#563663 0,rgba(86,54,99,0) 42%),radial-gradient(circle at 72% 12%,#1d5a55 0,rgba(29,90,85,0) 34%),radial-gradient(circle at 30% 92%,#5a4a2a 0,rgba(90,74,42,0) 30%)}
  .win{position:absolute;left:56px;top:40px;width:1328px;height:820px;border-radius:16px;border:1px solid rgba(255,255,255,0.09);box-shadow:0 30px 90px rgba(0,0,0,0.5);
    background:rgba(13,15,21,0.62);backdrop-filter:blur(28px) saturate(150%);display:flex;flex-direction:column;overflow:hidden}
  .strip{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px 0 86px;border-bottom:1px solid rgba(255,255,255,0.05);font-size:12px}
  .ws{height:24px;padding:0 10px;border-radius:7px;display:flex;align-items:center;gap:7px;color:#9aa0ab}
  .ws.on{background:rgba(255,255,255,0.06);color:var(--title)}
  .area{flex:1;min-height:0;position:relative;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .pane{border-radius:11px;background:var(--panel);border:1px solid rgba(255,255,255,0.07);display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .pane.on{border-color:var(--ring);box-shadow:0 0 0 3px var(--glow)}
  .phead{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:12px;color:var(--soft);border-bottom:1px solid rgba(255,255,255,0.05)}
  .term{flex:1;padding:10px 14px;font:12.5px/1.62 'JetBrains Mono',monospace;color:#c0c4cc;white-space:pre;overflow:hidden}
  .status{height:28px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;border-top:1px solid rgba(255,255,255,0.05);font-size:11.5px;color:var(--muted)}
  .dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
  .dot.working{background:var(--green)}.dot.waiting{background:var(--amber)}.dot.error{background:var(--red)}
  .dot.idle{border:1.5px solid var(--stopped);box-sizing:border-box}
  /* Timeline */
  .tl{position:absolute;top:10px;right:10px;bottom:10px;width:480px;border-radius:12px;background:rgba(15,17,23,0.90);
      border:1px solid rgba(255,255,255,0.09);box-shadow:-18px 0 50px rgba(0,0,0,0.38);display:flex;flex-direction:column;overflow:hidden}
  .tlhead{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 14px;border-bottom:1px solid rgba(255,255,255,0.05)}
  .chip{height:24px;padding:0 8px;border-radius:7px;border:1px solid transparent;color:#9aa0ab;font:500 11.5px Inter,sans-serif;display:flex;align-items:center;gap:6px}
  .chip.on{border-color:var(--ring);background:var(--glow);color:var(--title)}
  .chip .kbd{padding:1px 4px;font-size:10px}
  .sess{flex:none;padding:9px 14px;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid rgba(255,255,255,0.05)}
  .list{flex:1;min-height:0;overflow:hidden;padding:6px 0}
  .item{padding:7px 14px 7px 16px;position:relative;font-size:12.5px;line-height:1.5}
  .item.sel{background:var(--glow);box-shadow:inset 2px 0 0 var(--accent)}
  .who{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px;margin-bottom:3px}
  .who .t{margin-left:auto;letter-spacing:0;text-transform:none;font-family:'JetBrains Mono',monospace;font-size:10.5px}
  .prompt{color:var(--title);border-left:2px solid rgba(122,162,247,0.55);padding-left:9px}
  .clamp{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
  .tool{display:flex;align-items:center;gap:8px;height:24px;font-size:12px}
  .tool .chev{width:10px;color:var(--muted);font-size:10px}
  .tool .name{font-family:'JetBrains Mono',monospace;color:var(--cyan);font-size:11.5px}
  .tool .args{font-family:'JetBrains Mono',monospace;color:var(--soft);font-size:11.5px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tool .st{font-size:11px;display:flex;align-items:center;gap:5px;flex:none}
  .out{margin:4px 0 2px 18px;border-radius:7px;background:rgba(0,0,0,0.22);padding:7px 9px;font:11.5px/1.55 'JetBrains Mono',monospace;color:#c0c4cc;white-space:pre;overflow:hidden}
  .out .lab{font-family:Inter,sans-serif;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
  .more{font-family:Inter,sans-serif;font-size:11px;color:var(--muted);display:block;margin-top:4px}
  .sub{margin-left:18px;border-left:1px solid rgba(255,255,255,0.08);padding-left:10px}
  .divider{display:flex;align-items:center;gap:10px;padding:8px 14px;font-size:11px;color:var(--muted)}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,0.07)}
  .foot{height:30px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;border-top:1px solid rgba(255,255,255,0.05);font-size:11px;color:var(--muted);white-space:nowrap}
  .foot span{display:flex;align-items:center;gap:5px}
  .notice{margin-left:auto;color:var(--soft)}
  .field{height:26px;flex:1;border-radius:7px;border:1px solid var(--ring);background:rgba(0,0,0,0.18);display:flex;align-items:center;gap:7px;padding:0 9px;font-size:12px;color:var(--title)}
  .field .caret{width:1px;height:14px;background:var(--accent)}
  .group{padding:9px 14px 4px;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--soft)}
  .group .h{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .hit{padding:6px 14px 6px 16px;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:1px}
  .hit.sel{background:var(--glow);box-shadow:inset 2px 0 0 var(--accent)}
  mark{background:rgba(122,162,247,0.28);color:var(--title);border-radius:3px;padding:0 1px}
  .empty{flex:1;display:flex;flex-direction:column;gap:10px;padding:26px 22px}
  .row{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:7px;font-size:12px}
  .row.sel{background:var(--glow);box-shadow:inset 2px 0 0 var(--accent)}
  .banner{flex:none;margin:8px 12px 2px;border-radius:8px;border:1px solid rgba(255,255,255,0.09);background:rgba(255,255,255,0.035);padding:8px 10px;font-size:11.5px;color:var(--soft);line-height:1.5;display:flex;gap:8px}
</style>
</head>
<body>
<div id="root"></div>

    emptyTitle: 'This pane has no agent',
    emptyBody: 'The timeline shows the Claude Code or Codex turns of the focused pane. Start one here or pick a session from this project.',
    recent: 'Recent sessions · acme',
    r1: 'Fix the payments migration and run the tests', r1m: 'Claude Code · api · 1 · 3 min ago',
    r2: 'Refunds with discounts', r2m: 'Claude Code · yesterday 6:20 PM',
    r3: 'tax calculation refactor', r3m: 'Codex · Mon Nov 24',
    r4: 'bump stripe-node', r4m: 'Claude Code · Sun Nov 23',
    emptyKeys: [['↑↓', 'choose'], ['↵', 'open'], ['⌘F', 'search'], ['esc', 'close']],
    fbTitle: 'Antigravity leaves no transcript Smalti can read',
    fbBody: 'The timeline reads Claude Code and Codex. This pane’s work is still in its terminal; you can open another session of this project or search them all with ⌘F.',
    fbCodex: 'Smalti doesn’t know which Codex session this pane writes (it started before Smalti). Showing the latest one in <span class="mono">~/dev/acme/web</span>: it may not be this one.',
    fbSess: 'Codex · web · 2 · unidentified',
    fbTurns: '3 turns · 5 tools · since 11:05',
    fbP: 'Add a test for the refunds webhook',

  },
}[lang];

const kbd = k => `<span class="kbd">${k}</span>`;
const foot = (keys, notice) => `<div class="foot">${keys.map(([k, v]) => `<span>${kbd(k)}${v}</span>`).join('')}${notice ? `<span class="notice">${notice}</span>` : ''}</div>`;
const st = (kind, label) => {
  const c = {ok: 'var(--muted)', error: 'var(--red)', running: 'var(--green)', denied: 'var(--red)'}[kind];
  const d = {ok: '<span style="color:var(--green)">✓</span>', error: '<span class="dot error"></span>', running: '<span class="dot working"></span>', denied: '<span class="dot error"></span>'}[kind];
  return `<span class="st" style="color:${c}">${d}${label}</span>`;
};
const tool = (open, name, args, kind, label, extra = '') => `<div class="tool"><span class="chev">${open ? '▾' : '▸'}</span><span class="name">${name}</span><span class="args">${args}</span>${st(kind, label)}</div>${extra}`;

function header(active, focusField) {
  return `<div class="tlhead">
    <span style="font-weight:600;font-size:13px;color:var(--title)">${T.title}</span>
    <span style="flex:1"></span>
    <span class="chip ${active === 'session' ? 'on' : ''}">${T.session} ${kbd('⇧⌘T')}</span>
    <span class="chip ${active === 'search' ? 'on' : ''}">${T.search} ${kbd('⌘F')}</span>
    ${kbd('esc')}
  </div>`;
}

function sessionInfo(line, title, turns, harnessDot = 'working') {
  return `<div class="sess">
    <div style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--soft)"><span class="dot ${harnessDot}"></span>${line}</div>
    <div style="font-size:13px;color:var(--title);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>
    <div class="num" style="font-size:10.5px;color:var(--muted)">${turns}</div>
  </div>`;
}

function sessionPanel() {
  const testOut = `<span class="lab">${T.output}</span>&gt; acme-api@2.4.0 test
&gt; vitest run --reporter=dot

 FAIL  db/migrations/0042_payments.test.ts
   × applies on a database that already has amount_cents
     error: column "amount_cents" of relation "payments"
            already exists
<span class="more">${T.moreLines}</span>`;
  return `<div class="tl">${header('session')}
    ${sessionInfo(T.sessLine, T.sessTitle, T.turns)}
    <div class="list">
      <div class="divider">${T.compact}</div>
      <div class="item"><div class="who">${T.you}<span class="t">10:58</span></div><div class="prompt clamp" style="-webkit-line-clamp:3">${T.p1}</div></div>
      <div class="item"><div class="who">${T.claude}<span class="t">10:58</span></div><div class="clamp" style="-webkit-line-clamp:4">${T.a1}</div></div>
      <div class="item" style="padding-top:2px;padding-bottom:2px">${tool(false, 'Read', 'db/migrations/0042_payments.sql', 'ok', T.ok)}${tool(false, 'Edit', 'db/migrations/0042_payments.sql  +3 −1', 'ok', T.ok)}</div>
      <div class="item sel" style="padding-top:2px">${tool(true, 'Bash', 'npm test -- db/migrations', 'error', T.error, `<div class="out">${testOut}</div>`)}</div>
      <div class="item" style="padding-top:2px;padding-bottom:2px">${tool(true, 'Agent', T.sub, 'ok', T.subTools, `<div class="sub">${tool(false, 'Grep', 'amount_cents  src/', 'ok', T.ok)}${tool(false, 'Read', 'src/billing/refund.ts', 'ok', T.ok)}${tool(false, 'Bash', 'git log -S amount_cents --oneline', 'error', T.errorShort)}</div>`)}</div>
      <div class="item"><div class="who">${T.you}<span class="t">11:02</span></div><div class="prompt clamp" style="-webkit-line-clamp:3">${T.p2}</div>
        <div style="margin:5px 0 0 11px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px"><svg width="12" height="10" viewBox="0 0 12 10"><rect x=".5" y=".5" width="11" height="9" rx="1.5" fill="none" stroke="#8b919c"/><circle cx="4" cy="3.6" r="1" fill="#8b919c"/><path d="M1.5 8.5l3-3 2 2 1.5-1.5 2.5 2.5" fill="none" stroke="#8b919c"/></svg>${T.image}</div></div>
      <div class="item" style="padding-top:2px">${tool(false, 'Bash', 'npm test -- refund', 'running', T.running)}</div>
    </div>
    ${foot(T.keys, T.copied)}
  </div>`;
}

function searchPanel() {
  const group = (title, meta, n) => `<div class="group"><span style="color:var(--title);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</span><span class="num" style="color:var(--muted);margin-left:auto;flex:none">${n}</span></div><div style="padding:0 14px 3px;font-size:10.5px;color:var(--muted)">${meta}</div>`;
  const hit = (who, text, time, sel) => `<div class="hit ${sel ? 'sel' : ''}"><div class="who" style="margin:0">${who}<span class="t">${time}</span></div><div class="clamp" style="-webkit-line-clamp:2">${text}</div></div>`;
  return `<div class="tl">${header('search')}
    <div style="flex:none;padding:10px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid rgba(255,255,255,0.05)">
      <div class="field"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="3.6" fill="none" stroke="#8b919c" stroke-width="1.3"/><line x1="7.7" y1="7.7" x2="11" y2="11" stroke="#8b919c" stroke-width="1.3"/></svg>${T.query}<span class="caret"></span></div>
      <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)"><span style="color:var(--soft)">${T.scope}</span><span class="mono" style="font-size:10.5px">${T.scopeHint}</span><span style="margin-left:auto">${T.summary}</span></div>
    </div>
    <div class="list">
      ${group(T.g1, T.g1meta, 2)}
      ${hit(T.you, T.h1, '11:02', false)}
      ${hit(T.claude, T.h2, '11:03', true)}
      ${group(T.g2, T.g2meta, 4)}
      ${hit('Bash', T.h3, '18:12', false)}

}

}

}

function fallbackPanel() {
