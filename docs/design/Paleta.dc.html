<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paleta de comandos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#d7dae0}
a{color:#7aa2f7}a:hover{color:#a9c1fb}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10.5px;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,0.12);color:#aeb3bd;background:rgba(255,255,255,0.04)}
.grp{margin:0;padding:10px 12px 4px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8b919c}
.ghost{flex:1;border-radius:11px;background:rgba(6,7,10,0.30);border:1px solid rgba(255,255,255,0.05)}
.bar{height:7px;border-radius:4px;background:rgba(255,255,255,0.06)}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background-color: #0b0d12; background-image: radial-gradient(circle at 16% 20%, #284766 0, rgba(40,71,102,0) 38%), radial-gradient(circle at 84% 80%, #563663 0, rgba(86,54,99,0) 42%), radial-gradient(circle at 72% 12%, #1d5a55 0, rgba(29,90,85,0) 34%), radial-gradient(circle at 30% 92%, #5a4a2a 0, rgba(90,74,42,0) 30%)">
  <div style="position: absolute; left: 56px; top: 40px; width: 1328px; height: 820px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 30px 90px rgba(0,0,0,0.5); background: rgba(13,15,21,0.62); backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%); display: flex; flex-direction: column; overflow: hidden">
    <div style="height: 40px; flex: none; border-bottom: 1px solid rgba(255,255,255,0.05)"></div>
    <div style="flex: 1; display: grid; grid-template-columns: 1.35fr 1fr; grid-template-rows: 1fr 1fr; gap: 8px; padding: 10px; opacity: 0.45">
      <div class="ghost" style="grid-row: span 2; padding: 18px; display: flex; flex-direction: column; gap: 10px">
        <div class="bar" style="width: 60%"></div><div class="bar" style="width: 40%"></div><div class="bar" style="width: 72%"></div><div class="bar" style="width: 50%"></div>
      </div>
      <div class="ghost" style="padding: 18px; display: flex; flex-direction: column; gap: 10px"><div class="bar" style="width: 55%"></div><div class="bar" style="width: 35%"></div></div>
      <div class="ghost" style="padding: 18px; display: flex; flex-direction: column; gap: 10px"><div class="bar" style="width: 45%"></div><div class="bar" style="width: 62%"></div></div>
    </div>
  </div>

  <div style="position: absolute; left: 400px; top: 150px; width: 640px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.12); background: rgba(20,22,30,0.82); backdrop-filter: blur(36px) saturate(160%); -webkit-backdrop-filter: blur(36px) saturate(160%); box-shadow: 0 40px 100px rgba(0,0,0,0.55); overflow: hidden; display: flex; flex-direction: column">
    <label for="cmd" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.07)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8b919c" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
      <input id="cmd" type="text" value="layout" aria-label="Buscar comando" style="flex: 1; background: transparent; border: none; outline: none; color: #e6e9ef; font: 400 16px Inter, sans-serif">
      <span class="kbd">esc</span>
    </label>
    <div style="padding: 4px 6px 8px; display: flex; flex-direction: column">
      <p class="grp">Tiling</p>
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 8px; border: none; background: {{glow}}; color: #e6e9ef; font: 400 13.5px Inter, sans-serif; text-align: left">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="{{accent}}" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="2"></rect><path d="M8.5 2v12M8.5 8h6"></path></svg>
        <span style="flex: 1">Layout: Dwindle <span style="color: #8b919c">— cada panel nuevo divide el último</span></span>
        <span style="font-size: 11.5px; color: {{accent}}">actual</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 8px; border: none; background: transparent; color: #d7dae0; font: 400 13.5px Inter, sans-serif; text-align: left">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8b919c" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="2"></rect><path d="M5.8 2v12M10.2 2v12"></path></svg>
        <span style="flex: 1">Layout: Columnas</span>
        <span class="kbd">⌥⌘C</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 8px; border: none; background: transparent; color: #d7dae0; font: 400 13.5px Inter, sans-serif; text-align: left">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8b919c" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="2"></rect><path d="M1.5 8.5h13M8 8.5v5.5"></path></svg>
        <span style="flex: 1">Layout: Maestro + pila</span>
        <span class="kbd">⌥⌘M</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 8px; border: none; background: transparent; color: #d7dae0; font: 400 13.5px Inter, sans-serif; text-align: left">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8b919c" stroke-width="1.4" aria-hidden="true"><path d="M2 5h12M2 11h12M5 2.5L2 5l3 2.5M11 8.5l3 2.5-3 2.5"></path></svg>
        <span style="flex: 1">Igualar tamaños de paneles</span>
        <span class="kbd">⇧⌘=</span>
      </button>
      <p class="grp">Workspaces y sesiones</p>
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 8px; border: none; background: transparent; color: #d7dae0; font: 400 13.5px Inter, sans-serif; text-align: left">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8b919c" stroke-width="1.4" aria-hidden="true"><path d="M3 3h10v10H3zM6 8h4M8 6v4"></path></svg>
        <span style="flex: 1">Guardar layout actual como “solen-dev”</span>
      </button>
      <button type="button" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 8px; border: none; background: transparent; color: #d7dae0; font: 400 13.5px Inter, sans-serif; text-align: left">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#8b919c" stroke-width="1.4" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5V5h2.5"></path></svg>
        <span style="flex: 1">Restaurar layout “rizaria-full” <span style="color: #8b919c">— 4 paneles, retoma 2 sesiones de Claude</span></span>
      </button>
    </div>
    <div style="height: 36px; display: flex; align-items: center; gap: 16px; padding: 0 16px; border-top: 1px solid rgba(255,255,255,0.07); font-size: 11.5px; color: #8b919c">
      <span><span class="kbd">↑↓</span> navegar</span>
      <span><span class="kbd">↵</span> ejecutar</span>
      <span><span class="kbd">⌘↵</span> en panel nuevo</span>
      <span style="flex: 1"></span>
      <span>Todo lo que hacen los botones vive aquí</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7aa2f7","options":["#7aa2f7","#bb9af7","#7dcfff","#e0af68"],"section":"Apariencia"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.accent ?? '#7aa2f7';
    const hex = /^#[0-9a-fA-F]{6}$/.test(a) ? a : '#7aa2f7';
    return { accent: hex, glow: hex + '26' };
  }
}
</script>
</body>
</html>
